version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: yottaperf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: yotta_user
      POSTGRES_PASSWORD: yotta_password
      POSTGRES_DB: yottaperf_db
    ports:
      - "5434:5432"
    volumes:
      - yottaperf_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/starter_seed.sql:/docker-entrypoint-initdb.d/02_starter_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yotta_user -d yottaperf_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: yottaperf-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://yotta_user:yotta_password@postgres:5432/yottaperf_db
      SECRET_KEY: yottaperf-super-secure-jwt-secret-key-change-in-production
      API_V1_STR: /api
      PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: yottaperf-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8001/api
    ports:
      - "3002:3000"
    depends_on:
      - backend

volumes:
  yottaperf_pgdata:
    driver: local
